server {
    listen ${PORT} default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html index.htm;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    client_max_body_size 500M;

    # Dedicated healthcheck endpoint
    location = /healthcheck.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index healthcheck.php;
        fastcgi_pass 127.0.0.1:9000;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Disable XML-RPC unless explicitly required.
    location = /xmlrpc.php {
        return 403;
    }

    # Block direct access to maintenance and diagnostic scripts.
    location ~* ^/(?:phpinfo|local-phpinfo|local-xdebuginfo|diagnostic|diagnose-[^/]+|check-[^/]+|fix-[^/]+|reset-[^/]+|safe-search-replace|search-replace-urls|test-[^/]+|trace-wp-init|direct-wp-load|deactivate-cassify|find-local-url|setup-[^/]+|simple-[^/]+)\.php$ {
        return 404;
    }

    # Prevent access to dotfiles and sensitive metadata.
    location ~ /\. {
        deny all;
    }

    location = /wp-config.php {
        deny all;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        log_not_found off;
    }
}
