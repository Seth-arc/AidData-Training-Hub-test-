name: CI Smoke

on:
  pull_request:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Docker tooling
        run: |
          docker --version
          docker compose version

      - name: Locate compose file
        id: locate_compose
        shell: bash
        run: |
          set -euo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          ls -la

          REPO_ROOT="$(git rev-parse --show-toplevel)"
          echo "Repo root: $REPO_ROOT"

          # Prefer git-tracked files to avoid edge cases in runner filesystem discovery.
          COMPOSE_REL_PATH="$(git ls-files | grep -E '(^|/)(docker-compose\.ya?ml|compose\.ya?ml)$' | head -n 1 || true)"

          if [ -n "$COMPOSE_REL_PATH" ]; then
            COMPOSE_FILE_PATH="$REPO_ROOT/$COMPOSE_REL_PATH"
          else
            COMPOSE_FILE_PATH="$(find "$REPO_ROOT" -type f \( -name 'docker-compose.yml' -o -name 'docker-compose.yaml' -o -name 'compose.yml' -o -name 'compose.yaml' \) | head -n 1 || true)"
          fi

          if [ -z "$COMPOSE_FILE_PATH" ]; then
            echo "compose_found=false" >> "$GITHUB_OUTPUT"
            echo "No compose file found under repository."
            echo "Top-level repo files:"
            ls -la "$REPO_ROOT"
            exit 1
          fi

          echo "compose_found=true" >> "$GITHUB_OUTPUT"
          echo "compose_file=$COMPOSE_FILE_PATH" >> "$GITHUB_OUTPUT"
          echo "Using compose file: $COMPOSE_FILE_PATH"

      - name: Build stack
        run: docker compose -f "${{ steps.locate_compose.outputs.compose_file }}" build --no-cache

      - name: Start stack
        run: docker compose -f "${{ steps.locate_compose.outputs.compose_file }}" up -d

      - name: Wait for app readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/healthcheck.php > /tmp/health.txt; then
              echo "Health endpoint is ready"
              cat /tmp/health.txt
              exit 0
            fi
            sleep 2
          done
          echo "Health endpoint did not become ready in time"
          docker compose -f "${{ steps.locate_compose.outputs.compose_file }}" logs --no-color
          exit 1

      - name: Smoke endpoint checks
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/healthcheck.php | grep -q '^OK$'
          curl -fsS http://127.0.0.1:8080/wp-login.php | grep -qi 'log in\|login'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/xmlrpc.php)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/check-active-plugins.php)" = "404"

      - name: Assert banned plugins absent in runtime image
        run: |
          docker compose -f "${{ steps.locate_compose.outputs.compose_file }}" exec -T wordpress sh -lc "test ! -d /var/www/html/wp-content/plugins/all-in-one-wp-migration"
          docker compose -f "${{ steps.locate_compose.outputs.compose_file }}" exec -T wordpress sh -lc "test ! -d /var/www/html/wp-content/plugins/duplicator"
          docker compose -f "${{ steps.locate_compose.outputs.compose_file }}" exec -T wordpress sh -lc "test ! -d /var/www/html/wp-content/plugins/string-locator"

      - name: Collect logs on failure
        if: failure() && steps.locate_compose.outputs.compose_found == 'true'
        run: docker compose -f "${{ steps.locate_compose.outputs.compose_file }}" logs --no-color || true

      - name: Tear down stack
        if: always() && steps.locate_compose.outputs.compose_found == 'true'
        run: docker compose -f "${{ steps.locate_compose.outputs.compose_file }}" down -v || true
