name: CI Smoke

on:
  pull_request:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COMPOSE_FILE_PATH: .github/ci/compose.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Docker tooling
        run: |
          docker --version
          docker compose version

      - name: Verify CI compose file
        run: |
          test -f "$COMPOSE_FILE_PATH"
          echo "Using compose file: $COMPOSE_FILE_PATH"

      - name: Build stack
        run: docker compose -f "$COMPOSE_FILE_PATH" build --no-cache

      - name: Start stack
        run: docker compose -f "$COMPOSE_FILE_PATH" up -d

      - name: Wait for app readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/healthcheck.php > /tmp/health.txt; then
              echo "Health endpoint is ready"
              cat /tmp/health.txt
              exit 0
            fi
            sleep 2
          done
          echo "Health endpoint did not become ready in time"
          docker compose -f "$COMPOSE_FILE_PATH" logs --no-color
          exit 1

      - name: Smoke endpoint checks
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/healthcheck.php | grep -q '^OK$'
          login_code="$(curl -s -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:8080/wp-login.php)"
          test "$login_code" = "200" -o "$login_code" = "301" -o "$login_code" = "302"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/xmlrpc.php)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/check-active-plugins.php)" = "404"

      - name: Assert banned plugins absent in runtime image
        run: |
          docker compose -f "$COMPOSE_FILE_PATH" exec -T wordpress sh -lc "test ! -d /var/www/html/wp-content/plugins/all-in-one-wp-migration"
          docker compose -f "$COMPOSE_FILE_PATH" exec -T wordpress sh -lc "test ! -d /var/www/html/wp-content/plugins/duplicator"
          docker compose -f "$COMPOSE_FILE_PATH" exec -T wordpress sh -lc "test ! -d /var/www/html/wp-content/plugins/string-locator"

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f "$COMPOSE_FILE_PATH" logs --no-color || true

      - name: Tear down stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE_PATH" down -v || true
